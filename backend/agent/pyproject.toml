[project]
# Distribution `bacteria-agent`, imported as `bacteria.agent`. The two halves of
# this project share the `bacteria` namespace rather than owning two unrelated
# top-level names, which is what lets them be released separately without
# `agent` -- a name nothing should claim on PyPI -- ending up on sys.path.
name = "bacteria-agent"
# Real semver, unlike the application that hosts it. This package is the
# vendorable half -- it declares protocols other code implements, so a consumer
# needs to be able to say which shape of `SessionRepository` it was written
# against. `bacteria-app` stays at "0" because nothing consumes it.
#
# 0.2.0 rather than 0.1.1: since 0.1.0 the package went async throughout
# (ADR 0014), grew `session/protocol.py`, and added three methods to the store
# for the proposal lifecycle. Every one of those is a breaking change to an
# implementor, and pre-1.0 the minor is where breaking changes go.
version = "0.2.0"
description = "A small AI agent built as infrastructure: layered ownership boundaries, kept minimal enough to read."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Its own copy, not a reference to the root one. `license-files` globs cannot
# escape the project directory, and a wheel that names a licence it does not
# ship is worse than one that names none.
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.40.0",
    "anyio>=4.6.0",
    "google-genai>=1.0.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
# Named for the distribution rather than the project, because `bacteria` alone
# now means the whole repository -- and a bare `bacteria` command sitting beside
# `bacteria-serve` and `bacteria-worker` would read as the umbrella entry point
# rather than as the agent's standalone CLI, which is all it is.
bacteria-agent = "bacteria.agent.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# A PEP 420 namespace package: there is no `src/bacteria/__init__.py`, and there
# must not be. Both distributions install into `site-packages/bacteria/`, so an
# `__init__.py` in either would make that directory a regular package and hide
# the other's subpackage entirely. The layer map that used to live in that file
# is now in `bacteria/agent/__init__.py`, which is the module it describes.
module-name = "bacteria.agent"
namespace = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
# Auto mode: every `async def test_` runs without a per-test marker. The
# alternative (strict mode) means a forgotten marker silently *skips* a test
# rather than failing it, which is the worst failure mode a test suite can have.
asyncio_mode = "auto"
