[project]
name = "fastpaip"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "bacteria",
    "fastapi",
    "granian",
    "sqlmodel",
    "aiosqlite",
    "alembic",
    "pydantic-settings",
]

[project.scripts]
fastpaip-admin = "fastpaip.entrypoints.cli:main"

[tool.uv.sources]
# Resolved from packages/bacteria rather than an index. The agent is developed
# alongside this application, not consumed as a release.
bacteria = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
