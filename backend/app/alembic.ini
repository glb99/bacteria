# Alembic configuration for the bacteria-app package.
#
# `script_location` uses %(here)s so it resolves against this file rather than
# whatever directory alembic was invoked from -- the workspace root, usually.
#
# There is no `sqlalchemy.url` here on purpose. The URL comes from
# bacteria.app.core.settings, so that migrations and the application can never be
# pointed at different databases by editing one of two places.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
