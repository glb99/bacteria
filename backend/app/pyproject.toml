[project]
# Distribution `bacteria-app`, imported as `bacteria.app`. See the note on the
# namespace in `backend/agent/pyproject.toml`.
name = "bacteria-app"
# Deliberately unversioned, where `bacteria-agent` is not. Nothing consumes this
# package -- it is a deployed application, and its releases are commits. Giving
# it a semver would invite the question "compatible with what?", which has no
# answer.
version = "0"
description = "An HTTP service hosting the agent: durable conversations and a bulk import pipeline."
# No `readme`. The root README describes the workspace, and a path escaping this
# directory is not portable across build backends -- see `license-files` below.
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "bacteria-agent",
    "fastapi[standard]",
    "granian",
    "sqlmodel",
    "procrastinate",
    "psycopg[binary,pool]",
    "alembic",
    "pydantic-settings",
    # Declared even though `bacteria-agent` depends on it too. This package imports
    # `dotenv` directly, and leaning on a transitive dependency means that the
    # day the agent stops needing it, this breaks in a way that points at the
    # wrong package.
    "python-dotenv",
    # Declared by *this* package and never by `bacteria-agent`, which is the whole
    # point rather than an oversight -- see ADR 0003. The agent is vendorable and
    # must not carry a host's observability vendor into a host that never chose
    # one. The extras are the two instrumentations this application actually
    # composes; adding a third is a decision, not a convenience.
    "logfire[fastapi,psycopg,google-genai]",
]

[project.scripts]
bacteria-admin = "bacteria.app.entrypoints.cli:main"
bacteria-serve = "bacteria.app.entrypoints.asgi:main"
bacteria-worker = "bacteria.app.entrypoints.queue_worker:main"

# No `[tool.fastapi]` here, and that is deliberate rather than an omission.
#
# It lived here once, with the FastAPI Cloud Application Directory set to
# `backend/app` to match, which reads as the obvious arrangement: the deployed
# application is this package. It cannot work. This package declares
# `bacteria-agent = { workspace = true }` a few lines above, and a workspace
# member does not build without the root that declares it -- so a build rooted
# here fails on the dependency before it reaches any code.
#
# The entrypoint is declared in the root `pyproject.toml`, which is what
# `fastapi deploy` has to run from. See the comment there for what the failure
# looked like, since none of its three symptoms named the cause.

[tool.uv.sources]
# Resolved from backend/agent rather than an index. The agent is developed
# alongside this application, not consumed as a release.
bacteria-agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Same namespace as the agent, and for the same reason -- neither package may
# own `bacteria/` outright. See `backend/agent/pyproject.toml`.
module-name = "bacteria.app"
namespace = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
