# Static analysis of the workflows themselves.
#
# The bugs it finds are the ones that do not fail a run: an action pinned to a
# mutable tag, a token left readable by a step that had no need for it, a
# `pull_request_target` that checks out code from the pull request. CI going
# green is not evidence against any of them.
name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      # Kept even though this repo cannot use what it grants today. The scan
      # itself was passing; only "Upload SARIF file to GitHub Advanced
      # Security" failed, with "Resource not accessible by integration" --
      # GitHub Code Scanning refusing the upload, not zizmor finding anything.
      # The Security tab it feeds is part of GitHub Advanced Security, free on
      # public repositories and gated behind a paid plan on private ones.
      # `security-events: write` grants the permission; it does not turn the
      # feature on, and `advanced-security` below is what actually routes
      # around it. Left declared so the day this repository goes public or
      # upgrades, flipping that one input is the only change needed.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Skips the SARIF upload this repository's plan cannot accept, and
          # prints findings as inline run annotations instead -- visible on
          # every run and on a PR's Files tab, which is what a repo without
          # Advanced Security can actually use.
          advanced-security: false
          annotations: true
