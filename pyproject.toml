[project]
name = "fastpaip-workspace"
version = "0"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
# The root builds nothing. It exists to declare the workspace and to hold the
# toolchain both members are developed with.
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
# The toolchain is a dependency of the workspace, not a string in the Justfile.
# It used to be the latter: `uvx ruff@0.16.2`, pinned by hand because an
# unpinned `uvx` resolves the newest release every time and turned `check-all`
# red between two runs with no commit in between. The pin fixed that and left a
# second problem -- a version nothing tracked, bumped only when someone noticed.
# In the lockfile it is pinned *and* dependabot proposes the bump as a reviewable
# PR that CI runs before anyone merges it.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "coverage>=7.6",
    "fastapi[standard]",
    "ruff==0.16.2",
    "ty==0.0.70",
    "prek>=0.4.11,<1.0.0",
    "zizmor>=1.28.0",
    "rust-just>=1.58.0",
]

[tool.ruff]
# This section exists because its absence was a bug. With no configuration,
# `ruff check` enabled 413 rules chosen by whichever version `uvx` happened to
# resolve — so the gate's meaning changed when the tool released rather than
# when the code did, and `just check-all` was red without anyone having written
# anything wrong. A gate nobody can turn green is a gate nobody consults.
line-length = 100
# The workspace floor, not the application's. `bacteria` supports 3.11 and is
# meant to be vendorable into projects that do too; linting it as 3.13 would let
# a 3.13-only idiom through and break that promise silently.
target-version = "py311"

[tool.ruff.lint]
# Chosen, not inherited. Each family is here because it catches something:
#   E/F  — the core. F821 in this set found a `self` reference inside a
#          @staticmethod that every test missed, because the only path reaching
#          it was one the fakes never took.
#   I    — import order, so a diff never contains an unrelated reshuffle.
#   B    — bugbear, which is mostly real-defect rules rather than taste.
#   SIM  — a small number of genuine simplifications.
#   RUF  — including RUF100, which finds `noqa` comments suppressing rules that
#          no longer fire; a stale suppression hides the next real one.
#
# `UP` is deliberately absent. Its 47 findings here were almost entirely the
# alembic template's `Union[str, None]` and SQLModel's idiomatic `Optional[...]`
# in table definitions — a large diff across generated and framework-shaped
# code, catching nothing. Style rules that fight the frameworks in use cost more
# attention than they return.
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "RUF"]

[tool.coverage.run]
branch = true
parallel = true
# `bacteria` is deliberately absent. Its suite is architectural fitness
# functions, not line coverage, and its unevenness is the stated intent
# (packages/bacteria/docs/adr/0013). Pointing a coverage report at it produces a
# number whose only use is tempting someone to write the tests that record
# exists to decline. The application gets measured; the agent does not.
source = ["fastpaip"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Entrypoints hold configuration and nothing else. If one ever contains
# something worth testing, that is the signal it contains logic belonging
# somewhere else.
omit = ["**/entrypoints/*"]
