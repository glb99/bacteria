# Deploy to FastAPI Cloud on every push to main.
#
# Migrations run here, from the runner, before the deploy -- not from the
# application at startup. Nothing in this repository creates or upgrades a
# schema on boot, deliberately: a process that builds its own schema starts
# happily against a database missing a column and fails later at the query,
# which is worse than refusing to start. So the ordering is the deployment's
# job, and this is where it lives.
#
# That has a consequence worth stating: the database must be reachable from a
# GitHub-hosted runner. Neon and Supabase are; a database inside a private
# network is not, and would need this step to move to something that can reach
# it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two deploys at once, and never cancel one in flight. A cancelled
  # deploy can leave migrations applied with the old code still serving, which
  # is the one state nothing here knows how to reason about.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A deployment environment, so the secrets below are scoped to it and can
    # carry a required reviewer if this ever wants one.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
          enable-cache: true

      # Deployment is skipped, loudly, until the three secrets exist.
      #
      # The alternative was letting it fail, which is defensible right up until
      # you look at what it does to everything else: `main` goes red on the
      # first push and stays red until someone finishes a dashboard setup that
      # has nothing to do with the code. This repository already has an opinion
      # about that -- "a gate nobody can turn green is a gate nobody consults",
      # written in pyproject.toml about an unpinned linter, and it applies
      # exactly here.
      #
      # Skipping quietly would be its own lie, so it is not quiet: a notice, a
      # job summary naming what is missing, and no green tick claiming a deploy
      # happened.
      - name: Is deployment configured?
        id: configured
        env:
          TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
          DB: ${{ secrets.BACTERIA_DATABASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$TOKEN" ]  || missing+=("FASTAPI_CLOUD_TOKEN")
          [ -n "$APP_ID" ] || missing+=("FASTAPI_CLOUD_APP_ID")
          [ -n "$DB" ]     || missing+=("BACTERIA_DATABASE_URL")

          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deploy skipped::Not configured yet: ${missing[*]}"
          {
            echo "### Deploy skipped"
            echo
            echo "Nothing was deployed. These repository secrets are not set:"
            echo
            for name in "${missing[@]}"; do echo "- \`$name\`"; done
            echo
            echo "See [docs/DEPLOYMENT.md](../blob/main/docs/DEPLOYMENT.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - run: uv sync --all-packages
        if: steps.configured.outputs.ready == 'true'

      # `--check`, so a lockfile that disagrees with the pyprojects fails here
      # rather than deploying versions nothing tested.
      - name: Check the lockfile is current
        if: steps.configured.outputs.ready == 'true'
        run: uv lock --check

      - name: Apply migrations
        if: steps.configured.outputs.ready == 'true'
        env:
          BACTERIA_DATABASE_URL: ${{ secrets.BACTERIA_DATABASE_URL }}
        run: uv run just migrate

      # Run from the application directory, which is what FastAPI Cloud is
      # configured with and what makes `[tool.fastapi] entrypoint` in
      # backend/app/pyproject.toml resolvable without a --path flag.
      - name: Deploy
        if: steps.configured.outputs.ready == 'true'
        working-directory: backend/app
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: uv run fastapi deploy
