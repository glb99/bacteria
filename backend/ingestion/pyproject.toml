[project]
name = "ingestion"
version = "0.1.0"
description = "PDF ingestion pipeline, independent of the agent."
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "google-genai>=1.0.0",
    "pillow>=12",
    "pydantic>=2",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
