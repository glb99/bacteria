[dependency-groups]
dev = [
    "prek>=0.4.14,<1.0.0",
    "typer>=0.27.1,<1.0.0",
    "zizmor>=1.29.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

docs = [
    "mkdocstrings-python>=2.0.8",
    "zensical>=0.0.61",
]

[tool.uv.workspace]
members = ["backend/*"]