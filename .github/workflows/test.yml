# The gate. Every job here is a `just` recipe you can run locally with the same
# name, deliberately: a check that only exists in CI is a check people discover
# by having it reject them.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Any job needing more says so itself.
permissions:
  contents: read

concurrency:
  # Supersede an in-flight run when a branch is pushed again. Not applied to
  # `main`, where each commit's result is a record worth keeping.
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinned so a uv release cannot change what the gate means. Before
          # bumping, check astral-sh/setup-uv knows the new version's checksum.
          version: "0.11.18"
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run just lint

  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinned so a uv release cannot change what the gate means. Before
          # bumping, check astral-sh/setup-uv knows the new version's checksum.
          version: "0.11.18"
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run just typing

  test-agent:
    # Windows is here because this project keeps being bitten by it, and the
    # agent is the half that can be tested there cheaply -- pure Python, no
    # database, no event-loop policy to negotiate. `core/platform.py` and the
    # `pytest_asyncio_loop_factories` hook both exist because of Windows
    # behaviour that no Linux run would ever reveal.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinned so a uv release cannot change what the gate means. Before
          # bumping, check astral-sh/setup-uv knows the new version's checksum.
          version: "0.11.18"
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run just test-agent

  test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinned so a uv release cannot change what the gate means. Before
          # bumping, check astral-sh/setup-uv knows the new version's checksum.
          version: "0.11.18"
          enable-cache: true
      - run: uv sync --all-packages

      # Compose, not a `services:` block. The service block is the idiomatic
      # choice and would duplicate the image, credentials, and healthcheck that
      # compose.yml already states -- two declarations of one database, free to
      # drift, with the drift showing up as a test suite that passes here and
      # fails locally. `--wait` blocks on the same healthcheck `just db-up` uses.
      - name: Start Postgres
        run: uv run just db-up

      # No `Migrate` step, and its absence is deliberate rather than forgotten --
      # smoke.yml has one, so the asymmetry is worth a sentence.
      #
      # This suite never touches the configured database. `conftest.py` creates
      # `bacteria_test_<uuid>` and builds the schema straight from the models;
      # `test_migrations.py` creates another and replays the whole history into
      # it. Both connect to `postgres`, the maintenance database, to do so. A
      # step upgrading `bacteria` would therefore change nothing any test can
      # observe, which is worse than doing nothing: it reads as the thing
      # keeping the schema honest, and that is test_migrations.py's job.

      # `cov` rather than `test-app`: it runs the same suite and produces the
      # report below. Running both would run the tests twice.
      - name: Test with coverage
        run: uv run just cov

      # No --fail-under. The application is measured and the agent deliberately
      # is not (ADR 0013), so a single number over the workspace would be
      # meaningless, and a threshold over the application alone is a policy
      # nobody has chosen yet. Published so the choice can be made from data.
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: htmlcov
          include-hidden-files: true
          if-no-files-found: error

      - name: Stop Postgres
        if: always()
        run: docker compose down -v --remove-orphans

  # One required check for branch protection, instead of a list that has to be
  # edited in the GitHub UI every time a job is added or renamed. A skipped or
  # cancelled job counts as a failure here, which a plain `needs:` would not.
  console:
    # Needs both toolchains, which is the shape of the check rather than an
    # oversight: the client is generated from the application's own OpenAPI
    # document, so proving it has not drifted means building the Python
    # application and then running node against what it produced.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinned so a uv release cannot change what the gate means. Before
          # bumping, check astral-sh/setup-uv knows the new version's checksum.
          version: "0.11.18"
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-packages
      - run: npm ci
        working-directory: frontend
      # `console-check` regenerates the client and fails when it differs from
      # what was committed, so a backend rename cannot land without its client
      # change. It also type-checks the console against the regenerated types,
      # which is the half that names the line that has to change.
      - run: uv run just console-check
      # Built as well as checked. A client that type-checks and a bundle that
      # will not build are different failures, and the deploy runs the second
      # one -- so a green gate that never ran it would be a gate that cannot see
      # what production does.
      - run: uv run just console-build

  test-alls-green:
    if: always()
    needs: [lint, typing, test-agent, test-app, console]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
