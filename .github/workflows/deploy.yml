# Deploy to FastAPI Cloud on every push to main.
#
# Migrations run here, from the runner, before the deploy -- not from the
# application at startup. Nothing in this repository creates or upgrades a
# schema on boot, deliberately: a process that builds its own schema starts
# happily against a database missing a column and fails later at the query,
# which is worse than refusing to start. So the ordering is the deployment's
# job, and this is where it lives.
#
# That has a consequence worth stating: the database must be reachable from a
# GitHub-hosted runner. Neon and Supabase are; a database inside a private
# network is not, and would need this step to move to something that can reach
# it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two deploys at once, and never cancel one in flight. A cancelled
  # deploy can leave migrations applied with the old code still serving, which
  # is the one state nothing here knows how to reason about.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A deployment environment, so the secrets below are scoped to it and can
    # carry a required reviewer if this ever wants one.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.18"
          enable-cache: true

      # Deployment is skipped, loudly, until the three secrets exist.
      #
      # The alternative was letting it fail, which is defensible right up until
      # you look at what it does to everything else: `main` goes red on the
      # first push and stays red until someone finishes a dashboard setup that
      # has nothing to do with the code. This repository already has an opinion
      # about that -- "a gate nobody can turn green is a gate nobody consults",
      # written in pyproject.toml about an unpinned linter, and it applies
      # exactly here.
      #
      # Skipping quietly would be its own lie, so it is not quiet: a notice, a
      # job summary naming what is missing, and no green tick claiming a deploy
      # happened.
      - name: Is deployment configured?
        id: configured
        env:
          TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
          DB: ${{ secrets.BACTERIA_DATABASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$TOKEN" ]  || missing+=("FASTAPI_CLOUD_TOKEN")
          [ -n "$APP_ID" ] || missing+=("FASTAPI_CLOUD_APP_ID")
          [ -n "$DB" ]     || missing+=("BACTERIA_DATABASE_URL")

          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Deploy skipped::Not configured yet: ${missing[*]}"
          {
            echo "### Deploy skipped"
            echo
            echo "Nothing was deployed. These repository secrets are not set:"
            echo
            for name in "${missing[@]}"; do echo "- \`$name\`"; done
            echo
            echo "See [docs/DEPLOYMENT.md](../blob/main/docs/DEPLOYMENT.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - run: uv sync --all-packages
        if: steps.configured.outputs.ready == 'true'

      # `--check`, so a lockfile that disagrees with the pyprojects fails here
      # rather than deploying versions nothing tested.
      - name: Check the lockfile is current
        if: steps.configured.outputs.ready == 'true'
        run: uv lock --check

      - name: Apply migrations
        if: steps.configured.outputs.ready == 'true'
        env:
          BACTERIA_DATABASE_URL: ${{ secrets.BACTERIA_DATABASE_URL }}
        run: uv run just migrate

      # Before `fastapi deploy`, and the ordering is the whole point of this
      # step existing here rather than anywhere else.
      #
      # The platform builds from `pyproject.toml` and does not run npm, so
      # nothing on their side will ever produce this. The console is installed as
      # package data out of `backend/app/src/bacteria/app/console/`, and
      # `fastapi deploy` packages its working directory *at the moment it runs* --
      # so building afterwards, or in a separate job, ships an application whose
      # console directory is empty.
      #
      # That failure is silent by design elsewhere: `views.py` mounts nothing
      # when there is no `index.html`, deliberately, because an unbuilt checkout
      # is the ordinary state of a fresh clone. The same silence in production
      # means `/` answers 404 and every API route keeps working, which is a
      # deployment that looks entirely healthy from the smoke check down.
      - name: Set up Node
        if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the console
        if: steps.configured.outputs.ready == 'true'
        run: uv run just console-build

      # `fastapi deploy` archives its working directory with `rignore`, a
      # binding for Rust's `ignore` crate -- which honours `.gitignore`. So the
      # single line that keeps the build artifact out of git also kept it out of
      # the upload: the build ran, wrote the files, and the archiver walked past
      # them. The deploy reported success and `/` answered 404.
      #
      # Un-ignored here rather than committed. Committing built output would put
      # every frontend change in review twice, once as source and once as
      # minified bundle, and add a stale-artifact failure mode that nothing
      # would catch. The runner's checkout is disposable, so editing it costs
      # nothing and leaves the repository honest.
      #
      # Verified rather than assumed, because a `sed` that matches nothing fails
      # exactly like a `sed` that works. `git check-ignore` is the same question
      # the archiver asks, so if this step passes, the file will be uploaded.
      - name: Un-ignore the built console so the archiver uploads it
        if: steps.configured.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sed -i '\#^backend/app/src/bacteria/app/console/$#d' .gitignore

          if git check-ignore -q backend/app/src/bacteria/app/console/index.html; then
            echo "::error title=Console would not be uploaded::The built console is still ignored, so the archive will not contain it and the deployment will serve no console. The pattern this step removes no longer matches .gitignore."
            exit 1
          fi
          echo "console is uploadable: $(find backend/app/src/bacteria/app/console -type f | wc -l) files"

      # Run from the repository root, and no `working-directory:`. This step is
      # what chooses the build context -- `fastapi deploy` packages its own
      # working directory and uploads that -- so it, and not the dashboard's
      # Application Directory, is what has to name the root.
      #
      # It said `working-directory: backend/app`, which is where the deployed
      # application lives and is therefore the natural thing to write. The build
      # then failed on every attempt, always the same way: `bacteria-app`
      # declares `bacteria-agent = { workspace = true }`, and a workspace member
      # does not build without the root declaring `members = ["backend/*"]`.
      # Uploading only `backend/app` leaves that root behind.
      #
      # Two symptoms travelled with it and are worth recognising, because
      # neither points at the cause: uv resolved CPython 3.14 (no
      # `.python-version` in that directory), and the platform's own script
      # reported `cd: can't cd to backend/app` -- having been handed a context
      # that already was it.
      #
      # Moving `[tool.fastapi]` to the root pyproject was necessary and not
      # sufficient; while this line stood, the root was never uploaded for that
      # declaration to be found in.
      - name: Deploy
        if: steps.configured.outputs.ready == 'true'
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: uv run fastapi deploy

      # Verifies the deployment that just landed, which nothing did before. Six
      # failures shipped silently from this workflow -- four packaging, two
      # configuration -- and every one was found by hand from a pasted log, days
      # later. The last was `BACTERIA_RUN_WORKER_IN_API` never reaching the
      # process: the service conversed perfectly while nothing drained the queue.
      #
      # `--deployed` runs the narrow subset that says something about a
      # deployment rather than about the code -- serving, authenticating,
      # draining the queue. No agent turn, so this bills no vendor from CI; the
      # queue is proved with a deferred ingestion job instead, which is free.
      #
      # `vars.SMOKE_BASE_URL` and not a secret: a public URL is not one, and a
      # secret would be masked in exactly the log you are reading to find out
      # which host failed. Deliberately NOT named `BACTERIA_*` -- every variable
      # with that prefix that is not a setting is a refusal to boot, and this
      # step runs `bacteria-admin`.
      - name: Smoke-test what was deployed
        if: steps.configured.outputs.ready == 'true'
        env:
          BACTERIA_DATABASE_URL: ${{ secrets.BACTERIA_DATABASE_URL }}
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_BASE_URL}" ]; then
            echo "::notice title=Deployment not smoke-tested::Set the SMOKE_BASE_URL repository variable to the deployed URL."
            {
              echo "### Deployment not verified"
              echo
              echo "The deploy succeeded, but nothing checked it. Set the"
              echo "\`SMOKE_BASE_URL\` repository variable to the deployed URL."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv run python scripts/smoke.py --deployed --base-url "${SMOKE_BASE_URL}"
