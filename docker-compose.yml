# Postgres for development and tests.
#
# The application targets Postgres, so development runs on it too. SQLite was
# the default for a while and it hid things: it has no SKIP LOCKED, which the
# job queue needs, and its DDL differs enough that a migration could pass here
# and fail in production.
#
#   docker compose up -d      (or: just db-up)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fastpaip
      POSTGRES_PASSWORD: fastpaip
      POSTGRES_DB: fastpaip
    ports:
      # Published so the application, migrations, and tests all reach it the
      # same way, whether or not they run in a container themselves.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `just db-up` waits on this, so a migration cannot race a database that
      # is listening but not yet accepting queries.
      test: ["CMD-SHELL", "pg_isready -U fastpaip -d fastpaip"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
